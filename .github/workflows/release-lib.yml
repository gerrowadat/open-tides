# Publish pyopentides to PyPI on tag `pyopentides-vX.Y.Z`.
# Uses PyPI trusted publishing (OIDC). No token is stored anywhere.
name: Release pyopentides

on:
  push:
    tags: ["pyopentides-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#pyopentides-v}"
          ver="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$tag" = "$ver" ] || { echo "tag $tag != pyproject $ver"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
