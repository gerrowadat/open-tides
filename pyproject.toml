[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyopentides"
version = "0.1.0"
description = "Tide predictions from official national hydrographic sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Dave O'Connor" }]
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gerrowadat/open-tides"
Issues = "https://github.com/gerrowadat/open-tides/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "aioresponses",
  "pytest-homeassistant-custom-component",
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["pyopentides"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pyopentides"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
